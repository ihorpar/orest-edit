<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orest Edit v2 · Папір</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="ed.css">
<style>
  /* Папір: a manuscript sheet on a desk, corrections in pencil and ink instead of highlighter fills. */
  :root {
    --f-ui: "Golos Text", system-ui, sans-serif;
    --f-text: "Source Serif 4", Georgia, serif;
    --bg: #f4f4f1; --surface: #ffffff; --panel: #f6f6f3;
    --line: #e6e5e0; --line-strong: #c8c6be;
    --ink: #1f1f1c; --ink-2: #55544e; --ink-3: #8a8982;
    --accent: #1f4d3a; --accent-ink: #ffffff; --accent-soft: #e3ede7;
    --del-bg: transparent; --del-fg: #b3261e; --ins-bg: transparent; --ins-fg: #1f4d3a;
    --r: 4px; --r-sm: 3px; --panel-w: 460px;
  }
  .top { background: var(--bg); border-bottom-color: var(--line-strong); }
  .logo i { border-radius: 3px; }
  .fmt { background: var(--bg); border-bottom: 0; padding: 0 40px; }
  .sheet {
    max-width: 840px; margin: 6px auto 72px; padding: 72px 84px 140px 108px; min-height: calc(100vh - 180px);
    background: var(--surface); border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(40, 40, 35, 0.08), 0 2px 3px rgba(40, 40, 35, 0.08), 0 18px 48px rgba(40, 40, 35, 0.14);
  }
  .kicker { color: var(--ink-3); letter-spacing: 0.2em; }
  .ms { font-size: 19.5px; }
  .ms h1 { font-weight: 600; font-size: 38px; }
  .sg del { text-decoration-thickness: 1.5px; text-decoration-color: var(--del-fg); }
  .sg ins { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; margin-left: 4px; }
  .sg-fact del { background: none; color: var(--warn); text-decoration-color: var(--warn); }
  .callout { background: var(--panel); border-top-width: 1px; border-radius: 0; }

  /* The panel is a second sheet: an index card with paper tabs, entries ruled like a ledger. */
  #panel { background: none; border-left: 0; padding: 6px 24px 20px 0; }
  #tabs { background: none; border-bottom: 0; padding: 0 12px; gap: 4px; position: relative; z-index: 1; }
  #tabs button { height: 40px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--ink-2); }
  #tabs button.on { background: var(--surface); border-color: var(--line-strong); margin-bottom: -1px; }
  #tabs button.on::after { display: none; }
  #body { background: var(--surface); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 4px 4px 0 0; padding: 26px 26px 36px; box-shadow: 0 10px 30px rgba(40, 40, 35, 0.1); }
  .proto { background: var(--surface); border: 1px solid var(--line-strong); border-top-color: var(--line); border-radius: 0 0 4px 4px; padding: 10px 26px; }
  #body h2 { font: italic 500 25px/1.2 var(--f-text); }
  .sec { letter-spacing: 0.14em; font-size: 11.5px; border-bottom: 1px solid var(--ink); padding-bottom: 7px; margin-bottom: 0; color: var(--ink); }
  .passes { border: 0; padding: 0; background: none; }
  .pass { padding: 11px 0; border-radius: 0; border-bottom: 1px solid var(--line); }
  .pass.on, .pass.on:hover { background: var(--accent-soft); margin: 0 -26px; padding: 11px 26px; }
  .pass.ran:hover { background: none; }
  .ico { border-radius: 50%; background: none; border: 1px solid color-mix(in srgb, var(--t) 45%, transparent); }
  .pass .n { background: none; border: 1px solid var(--t); }
  .queue { gap: 0; }
  .card { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 16px 0 14px; }
  .card:hover, .card.is-hot { border-color: var(--line-strong); }
  .card.is-focus { box-shadow: none; background: var(--accent-soft); margin: 0 -26px; padding: 16px 26px 14px; border-color: transparent; }
  .card .what { font-size: 17px; }
  .starter:first-of-type { border-top: 0; }
  .finds li:first-child { border-top: 0; }
  .finding, .scope { background: var(--panel); border-color: var(--line); }
  .empty { border-style: solid; border-color: var(--line); background: var(--panel); margin-top: 12px; }
  .filterbar { margin-top: 12px; }
  .summary { padding-bottom: 4px; }
  .summary b { font-style: italic; font-weight: 500; font-size: 30px; }
  .btn.solid, .btn.soft, .btn.outline { border-radius: 3px; }
  #selbar { border-radius: 4px; }
  #selbar button { border-radius: 3px; }
  @media (max-width: 980px) {
    #panel { padding: 0; }
    #body { border-left: 0; border-right: 0; box-shadow: none; }
    .proto { display: none; }
    .sheet { margin: 0; padding: 32px 20px 120px; box-shadow: none; }
  }
</style>
</head>
<body>
<script src="shared.js"></script>
<script src="ed.js"></script>
</body>
</html>
