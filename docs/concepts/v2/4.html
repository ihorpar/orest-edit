<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orest Edit v2 · 4 · Три вкладки</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="r3.css">
<style>
  .app { display: grid; grid-template-columns: minmax(0, 700px) minmax(0, 400px); gap: 40px; justify-content: center; align-items: start; padding: 0 24px; }
  #doc { padding: 44px 0 120px; }
  /* One panel beside the text; the queue is a list here, not notes scattered along the margin */
  #panel { position: sticky; top: 48px; height: calc(100vh - 48px); display: flex; flex-direction: column; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--bone); min-width: 0; }
  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); background: var(--porcelain); }
  #tabs button { border: 0; border-bottom: 2px solid transparent; background: none; padding: 11px 6px 9px; cursor: pointer; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--sub); }
  #tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  #tabs em { font-style: normal; font-weight: 400; color: var(--muted); margin-left: 4px; }
  #tab { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 10px; align-content: start; font-size: 13px; }
  #tab .passes { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .q { display: grid; gap: 8px; }
  .q-h { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--sub); margin: 6px 0 0; }
  @media (max-width: 1000px) {
    .app { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0; }
    #panel { position: static; height: auto; order: -1; border: 0; border-bottom: 1px solid var(--line); }
    #tab { max-height: 46vh; }
    #tab.shut { display: none; }
    #doc { padding: 28px 16px 100px; }
  }
</style>
</head>
<body>
<header id="hd"></header>
<div class="app">
  <main id="doc" class="ms"></main>
  <aside id="panel"><nav id="tabs"></nav><div id="tab"></div></aside>
</div>

<script src="shared.js"></script>
<script src="r3.js"></script>
<script>
  O.header(4);
  const $ = (id) => document.getElementById(id);
  const narrow = window.matchMedia("(max-width: 1000px)").matches;
  let tab = narrow ? null : "ov", seen = null;

  function queue() {
    if (P.quiet) { const s = P.focus && O.get(P.focus); return s ? P.quietCard(s) : `<p class="zd">У черзі нічого не лишилось.</p>`; }
    const q = P.queue();
    return q.length ? q.map(P.card).join("") : P.shown.size ? `<p class="zd">${P.filter === "all" ? "Усе вирішено." : "Для цього типу все вирішено."}</p>` : "";
  }

  P.init(() => {
    const n = { ov: (P.diag === "done" ? O.DIAG.length : 0) + (P.fact === "done" ? 1 : 0), ed: P.left() };
    $("tabs").innerHTML = ["ov", "ed", "ask"].map((k) =>
      `<button data-tab="${k}" class="${tab === k ? "on" : ""}" title="${P.ZONES[k][1]}">${P.ZONES[k][0]}${n[k] ? `<em>${n[k]}</em>` : ""}</button>`).join("");
    $("tab").className = tab ? "" : "shut";
    $("tab").innerHTML = !tab ? "" : `<p class="zd">${P.ZONES[tab][1]}</p>` + (tab === "ed"
      ? P.body("ed", { noTools: true }) + (P.shown.size ? `<p class="q-h">Черга · ${P.progress().toLowerCase()}</p>${P.tools()}<div class="q">${queue()}</div>` : "")
      : P.body(tab));
    $("doc").innerHTML = O.doc(P.opt());
    // Card and mark are far apart, so bring the other one into view when the focus moves
    if (P.focus !== seen) {
      seen = P.focus;
      [$("doc").querySelector(".is-focus"), $("tab").querySelector(".is-focus")].forEach((el) => { if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
    }
  }, { reset: () => { tab = narrow ? null : "ov"; seen = null; } });

  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]");
    if (!b) return;
    tab = narrow && tab === b.dataset.tab ? null : b.dataset.tab;   // on a phone a second tap folds the panel away
    P.emit();
  });
  // A click on a mark in the text should land on its card
  $("doc").addEventListener("click", (e) => { if (e.target.closest("[data-s]") && tab !== "ed") { tab = "ed"; seen = null; P.emit(); } });
  $("tab").addEventListener("click", (e) => { if (e.target.closest("[data-toq]")) { tab = "ed"; } });
</script>
</body>
</html>
