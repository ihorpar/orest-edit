<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orest Edit v2 · раунд 2 · 3 · Розкадровка</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--bone); }
  .bar {
    position: sticky; top: 48px; z-index: 20;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px;
    padding: 8px 20px; background: var(--porcelain); border-bottom: 1px solid var(--line);
  }
  .bar .chips { flex: 1 1 260px; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; white-space: nowrap; }
  #board { max-width: 1120px; margin: 0 auto; padding: 28px 20px 120px; }
  #board > h1 { font: 700 26px/1.25 var(--ms); margin: 0 0 4px; }
  .sum { color: var(--sub); font-size: 13px; margin: 0 0 24px; }
  .k { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--sub); display: block; }

  .sec { margin-bottom: 26px; }
  .sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 0 2px 10px; }
  .sec-h h2 { font: 600 19px/1.3 var(--ms); margin: 0; }
  .sec-h p { margin: 0; flex: 1 1 260px; color: var(--sub); font-size: 13px; }
  .sec-h.ghost h2 { color: var(--blue); }
  .sec-h.none h2 { color: var(--muted); font-weight: 400; font-style: italic; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: pointer; }
  .card:hover { border-color: #94a3b8; }
  .card.dim { opacity: 0.4; }
  .card.ghost { border-style: dashed; }
  .card.co { background: var(--bone); border-left: 3px solid var(--ink); cursor: default; }
  .card.co.ghost { background: #eff6ff; border-color: #93c5fd; border-left-color: var(--blue); }
  .card.vis.ghost { background: #fdf2f8; border-color: #f9a8d4; }
  .card b { font-weight: 600; }
  .ex { margin: 0; font: 400 14px/1.5 var(--ms); letter-spacing: 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card .why { margin: 0; font-size: 12px; color: var(--sub); }
  .card footer { margin-top: auto; padding-top: 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px; }
  .bds { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 400 11px var(--mono); color: var(--sub); }
  .bds span { display: inline-flex; align-items: center; gap: 4px; }
  .bds i { width: 7px; height: 7px; border-radius: 999px; }
  .card.open { grid-column: 1 / -1; cursor: default; border-color: var(--ink); padding: 16px 18px; gap: 12px; }
  .card.open > header { display: flex; justify-content: space-between; align-items: center; }
  .card.open .ms { max-width: 720px; }
  .card.open .ms p { margin: 0; }
  .card.open .its { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); align-items: start; }
  .card.open .ask { max-width: 520px; }
  @media (min-width: 860px) { .card.open .vz { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 22px; } }
  @media (max-width: 520px) { #board { padding: 20px 12px 100px; } .bar { padding: 8px 12px; } }
</style>
</head>
<body>
<header id="hd"></header>
<div class="bar"><div class="chips" id="chips"></div><div id="bulk"></div></div>
<main id="board"></main>

<script src="shared.js"></script>
<script>
  O.header("r2-3");
  let filter = "all", open = null, askErr = false;
  const board = document.getElementById("board"), bulk = document.getElementById("bulk");
  const yn = `<span class="acts"><button class="icon-btn no" data-a="rejected" title="Відхилити">✕</button><button class="icon-btn yes" data-a="accepted" title="Прийняти">✓</button></span>`;
  const dim = (on) => (filter !== "all" && !on ? " dim" : "");
  const words = (b) => b.text.split(/\s+/).length;

  // A pending or accepted H2 starts a new row; rejecting it merges the row back.
  function sections() {
    const out = [{ head: null, cards: [] }];
    O.blocks.filter((b) => b.tag === "p").forEach((b, i) => {
      const mine = O.S.filter((s) => s.block === b.id && s.status !== "rejected");
      mine.filter((s) => s.type === "structure").forEach((s) => out.push({ head: s, cards: [] }));
      const sec = out[out.length - 1];
      sec.cards.push({ b, n: i + 1 });
      mine.filter((s) => s.type === "interest" || s.type === "visual").forEach((s) => sec.cards.push({ s }));
    });
    return out.filter((sec) => sec.head || sec.cards.length);
  }

  function textCard(b, n) {
    const p = O.pending((s) => s.block === b.id && s.from);
    if (open === b.id) return `<article class="card open" data-card="${b.id}">
      <header><span class="k">Абзац ${n} · ${words(b)} сл.</span><button class="icon-btn" data-close title="Згорнути">✕</button></header>
      <div class="ms">${O.para(b)}</div>
      ${p.length ? `<ul class="its">${p.map((s) => O.item(s)).join("")}</ul>` : `<span class="done">У цьому абзаці все вирішено.</span>`}
      <form class="ask"><input placeholder="Свій запит до цього абзацу…" autocomplete="off"><button class="btn">Надіслати</button></form>
      ${askErr ? `<p class="err">Прототип не відповість: довільний запит потребує моделі.</p>` : ""}
    </article>`;
    const types = Object.keys(O.TYPES).map((k) => [k, p.filter((s) => s.type === k).length]).filter((x) => x[1]);
    return `<article class="card${dim(p.some((s) => s.type === filter))}" data-card="${b.id}">
      <span class="k">Абзац ${n} · ${words(b)} сл.</span>
      <p class="ex">${O.inline(b, (s) => (s.status === "accepted" ? O.applied(s) : O.esc(s.from)))}</p>
      <footer><span class="bds">${types.length ? types.map(([k, c]) => `<span title="${O.TYPES[k].label}"><i style="background:${O.TYPES[k].color}"></i>${c}</span>`).join("") : "без зауваг"}</span></footer>
    </article>`;
  }

  function sugCard(s) {
    const ghost = s.status === "pending";
    if (s.type === "interest") return `<article class="card co${ghost ? " ghost" : ""}${dim(ghost && filter === "interest")}" data-s="${s.id}">
      <span class="k">Врізка · ${O.esc(s.kind)}${ghost ? " · пропозиція" : ""}</span><b>${O.esc(s.title)}</b><p class="ex">${O.esc(s.body)}</p>
      ${ghost ? `<p class="why">${O.esc(s.reason)}</p><footer><span></span>${yn}</footer>` : ""}</article>`;
    const head = `<span class="k">Візуал · ${O.INTENTS[s.intent]}${ghost ? " · пропозиція" : ""}</span>`;
    if (open === s.id) return `<article class="card open" data-card="${s.id}">
      <header>${head}<button class="icon-btn" data-close title="Згорнути">✕</button></header>
      <p class="why">${O.esc(s.reason)}</p>${O.vz(s)}</article>`;
    return `<article class="card vis${ghost ? " ghost" : ""}${dim(ghost && filter === "visual")}" data-card="${s.id}">
      ${head}${O.frame(s, true)}<b>${O.esc(s.title)}</b>
      ${ghost ? `<p class="why">${O.esc(s.reason)}</p>` : ""}
      <footer><span class="bds">${ghost ? "" : "у тексті"}</span><span class="acts">${ghost ? `<button class="icon-btn no" data-s="${s.id}" data-a="rejected" title="Відхилити">✕</button>` : ""}<button class="btn">Відкрити</button></span></footer></article>`;
  }

  function render() {
    O.chips(document.getElementById("chips"), filter, (k) => { filter = k; render(); });
    const p = O.pending((s) => s.type === filter && s.type !== "visual");
    bulk.innerHTML = p.length ? `<button class="btn primary" data-all>Прийняти всі: ${O.TYPES[filter].label} · ${p.length}</button>` : "";
    const secs = sections();
    const count = (f) => O.S.filter((s) => s.status !== "rejected" && f(s)).length;
    board.innerHTML = `<h1>${O.esc(O.blocks[0].text)}</h1>
      <p class="sum">Розділів: ${secs.length} · абзаців: ${O.blocks.length - 1} · врізок: ${count((s) => s.type === "interest")} · візуалів: ${count((s) => s.type === "visual")}. Пунктир — пропозиції ШІ, суцільна рамка — вже в рукописі.</p>` +
      secs.map(({ head, cards }) => `<section class="sec">` +
        (head ? `<header class="sec-h${head.status === "pending" ? " ghost" : ""}" data-s="${head.id}">
            <span class="k">H2${head.status === "pending" ? " · пропозиція" : ""}</span><h2>${O.esc(head.title)}</h2>
            ${head.status === "pending" ? `<p>${O.esc(head.reason)}</p>${yn}` : ""}</header>`
          : `<header class="sec-h none"><h2>Без підзаголовка</h2></header>`) +
        `<div class="cards">${cards.map((c) => (c.b ? textCard(c.b, c.n) : sugCard(c.s))).join("")}</div></section>`).join("");
  }

  board.addEventListener("click", (e) => {
    if (e.target.closest("[data-vz], .ask")) return;
    if (e.target.closest("[data-close]")) { open = null; return render(); }
    const a = e.target.closest("[data-a]");
    if (a) return O.set(a.closest("[data-s]").dataset.s, a.dataset.a);
    const c = e.target.closest("[data-card]");
    if (c && c.dataset.card !== open) {
      open = c.dataset.card; askErr = false;
      render();
      board.querySelector(".card.open").scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  });
  board.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!e.target.querySelector("input").value.trim()) return;
    askErr = true;   // no model here, so say so instead of inventing an answer
    render();
  });
  bulk.addEventListener("click", (e) => {
    if (e.target.closest("[data-all]")) O.set(O.pending((s) => s.type === filter).map((s) => s.id), "accepted");
  });

  O.hover(board);
  O.on(() => { const s = open && O.get(open); if (s && s.status === "rejected") open = null; render(); });
  document.getElementById("reset").onclick = () => { filter = "all"; open = null; askErr = false; O.reset(); };
  render();
</script>
</body>
</html>
