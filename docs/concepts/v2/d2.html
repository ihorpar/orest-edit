<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orest Edit v2 · Вечір</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Manrope:wght@400..700&display=swap">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="ed.css">
<style>
  /* Вечір: a warm low-light room for long reading sessions. Lamp amber, no blue-black, no glow. */
  :root {
    --f-ui: "Manrope", system-ui, sans-serif;
    --f-text: "Lora", Georgia, serif;
    --f-head: var(--f-ui);
    --bg: #1b1916; --surface: #24211d; --panel: #1f1c19;
    --line: #35312b; --line-strong: #4a453d;
    --ink: #ebe5d8; --ink-2: #b9b1a2; --ink-3: #857e71;
    --accent: #e3ab55; --accent-ink: #231c0f; --accent-soft: #3a3021;
    --ok: #7fc8a2; --ok-soft: #223b30; --bad: #ee9382; --bad-soft: #472722; --warn: #e5b866; --warn-soft: #40331c;
    --del-bg: #43241f; --del-fg: #f0a596; --ins-bg: #203a2e; --ins-fg: #a3dcbc;
    --t-structure: #8fb4ec; --t-clarity: #7fc8a2; --t-interest: #c4a3e6; --t-visual: #eb9cc0;
    --t-accent: #7cc7d6; --t-spell: #ee9382; --t-fact: #e5b866;
    --lift: 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 36px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  .ms { font-size: 19px; line-height: 1.8; color: #e4ddcf; }
  .ms h1 { color: var(--ink); font-weight: 600; }
  .kicker { color: var(--accent); }
  #body h2 { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
  .logo i { font-family: var(--f-text); }
  .btn.soft { color: var(--accent); }
  .btn.outline { background: none; }
  .btn.outline:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  #tabs b { color: var(--accent-ink); }
  .passes, .card, .finding, .scope { border-color: var(--line); }
  .card { box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset; }
  .callout { background: var(--surface); border-top-color: var(--accent); }
  .switch i::after { background: var(--ink); }
  .switch.on i::after { background: var(--accent-ink); }
  #selbar { background: var(--accent); }
  #selbar button { color: var(--accent-ink); font-weight: 600; }
  #selbar button:hover { background: rgba(35, 28, 15, 0.14); }
  #selbar .own { box-shadow: -1px 0 0 rgba(35, 28, 15, 0.25); }
  #toast { background: var(--ink); color: var(--bg); }
  .seg button.on, .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ph-empty, .ph-busy { background: var(--panel); color: var(--ink-3); border-color: var(--line-strong); }
  #studio { background: rgba(0, 0, 0, 0.6); }
</style>
</head>
<body>
<script src="shared.js"></script>
<script src="ed.js"></script>
</body>
</html>
