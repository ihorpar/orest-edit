<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orest Edit v2 · раунд 2 · 1 · Поля і команда</title>
<link rel="stylesheet" href="shared.css">
<style>
  .bar {
    position: sticky; top: 48px; z-index: 20;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px;
    padding: 8px 20px; background: var(--porcelain); border-bottom: 1px solid var(--line);
  }
  .bar .chips, #quick { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .bar .chips { flex: 1 1 260px; min-width: 0; }
  .chip { flex: none; white-space: nowrap; }
  .hint { flex: 1 1 260px; margin: 0; color: var(--muted); font-size: 13px; }
  #bulk { display: flex; gap: 8px; align-items: center; }
  .switch { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; font-size: 13px; padding: 4px 0; white-space: nowrap; }
  .switch i { width: 30px; height: 18px; border-radius: 999px; background: #cbd5e1; position: relative; transition: background 0.15s; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 999px; background: #fff; transition: left 0.15s; }
  .switch[aria-checked="true"] i { background: var(--ink); }
  .switch[aria-checked="true"] i::after { left: 14px; }

  #doc { padding: 40px 20px 300px; }
  #doc ::selection { background: #bfdbfe; }
  .row { display: grid; grid-template-columns: minmax(0, 680px) 300px; gap: 36px; justify-content: center; }
  .quiet .row { grid-template-columns: minmax(0, 680px); }
  .notes { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
  .note { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; cursor: pointer; }
  .note.is-focus, .note.is-hot { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
  .note-top { display: flex; align-items: center; justify-content: space-between; }
  .note p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: #334155; }
  .sg.dim { border-bottom: 2px dotted #94a3b8; border-radius: 0; }
  .sg.dim:hover { background: var(--bone); }

  /* Chapter overview: a read-only note above the title, not a step */
  .diag { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 28px; font: 400 13px/1.45 var(--ui); letter-spacing: -0.01em; }
  .diag header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .diag header span:nth-child(2) { color: var(--muted); flex: 1; }
  .diag ul { list-style: none; margin: 0; padding: 0; }
  .diag li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .diag li p { margin: 0; color: #334155; grid-column: 1; }
  .diag li .btn { grid-column: 2; grid-row: 1 / span 2; }
  .diag b { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .diag b i { width: 7px; height: 7px; border-radius: 999px; }

  /* One bottom panel, two faces: the command line, or (in quiet mode) the review dock */
  #bottom {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25;
    width: min(720px, calc(100vw - 24px));
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12); overflow: hidden;
  }
  #cmd { padding: 12px; }
  #dock, #back { display: none; }
  .quiet:not(.face-cmd) #dock { display: block; }
  .quiet:not(.face-cmd) #cmd { display: none; }
  .quiet #back { display: inline-block; }
  #scope { display: none; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--sub); }
  #scope.on { display: flex; }
  #scope span { white-space: nowrap; }
  #scope q { color: var(--ink); font-family: var(--ms); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #scope button { border: 0; background: none; cursor: pointer; color: var(--muted); }
  .field { display: flex; gap: 8px; }
  .field input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 15px; outline: none; }
  .field input:focus { border-color: var(--blue); }
  #quick { margin-top: 10px; }
  #status { margin-top: 10px; display: none; align-items: center; gap: 10px; font-size: 13px; }
  #status.on { display: flex; }
  #status.err { color: var(--red); }

  .progress { height: 3px; background: var(--line); }
  .progress i { display: block; height: 100%; background: var(--ink); transition: width 0.2s; }
  .dock-body { padding: 12px 14px; }
  .dock-top { display: flex; align-items: center; justify-content: space-between; }
  .count { font: 400 11px var(--mono); color: var(--muted); }
  .reason { margin: 6px 0 12px; font-size: 14px; line-height: 1.5; color: #1e293b; }
  .dock-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dock-acts .sp { flex: 1; }
  .end b { display: block; font-size: 15px; }
  .end span { color: var(--sub); font-size: 13px; display: block; margin: 2px 0 10px; }

  @media (max-width: 900px) {
    .row { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .notes { padding-bottom: 20px; }
    .bar { padding: 8px 12px; }
    .bar .chips, .hint { flex-basis: 160px; }
    #bulk { order: 3; }
    .diag li { grid-template-columns: minmax(0, 1fr); }
    .diag li .btn { grid-column: 1; grid-row: auto; justify-self: start; margin-top: 6px; }
  }
  @media (max-width: 520px) { .dock-acts .btn kbd, .dock-acts .nav-l { display: none; } }
</style>
</head>
<body>
<header id="hd"></header>
<div class="bar">
  <div class="chips" id="chips"></div>
  <p class="hint" id="hint">Чистий рукопис. Оберіть команду внизу або виділіть фрагмент.</p>
  <div id="bulk"></div>
  <button class="switch" id="quiet" role="switch" aria-checked="false" title="Одна правка за раз, без розмітки на полях"><i></i>Тихий режим</button>
</div>
<main id="doc"></main>

<div id="bottom">
  <div id="dock"></div>
  <div id="cmd">
    <div id="scope"><span>Лише для фрагмента:</span><q></q><button title="Зняти виділення">✕</button></div>
    <form class="field" id="form">
      <button type="button" class="btn" id="back" title="Повернутися до правок (Esc)">← Правки</button>
      <input id="q" autocomplete="off" placeholder="Що зробити з розділом?">
      <button class="btn primary">Запустити</button>
    </form>
    <div class="chips" id="quick"></div>
    <div id="status"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  O.header("r2-1");
  const CMDS = [
    ["diag", "Огляд розділу", /огляд|діагност|проблем/i],
    ["clarity", "Спростити мову", /спрост|ясн|прост|зрозум/i],
    ["structure", "Додати підзаголовки", /заголов|структур/i],
    ["interest", "Запропонувати врізки", /врізк|аналог|цікав|інтерес/i],
    ["visual", "Запропонувати візуали", /візуал|ілюстр|інфограф|зображ|картин/i],
    ["accent", "Розставити акценти", /акцент|жирн|виділ/i],
    ["spell", "Перевірити правопис", /правопис|помилк|орфограф/i],
    ["fact", "Перевірити факти", /факт/i]
  ];
  const shown = new Set();   // ids already "generated"
  let scope = null;          // { block, text } when the editor selected a fragment
  let busy = false, msg = null, diag = false;
  let filter = "all", focus = null;
  let quiet = false, face = "dock";   // face only matters in quiet mode

  const $ = (id) => document.getElementById(id);
  const doc = $("doc"), dock = $("dock"), status = $("status"), scopeEl = $("scope"), input = $("q"), bulk = $("bulk");
  const vis = (s) => shown.has(s.id) && (filter === "all" || s.type === filter);
  const queue = () => O.pending(vis);

  $("quick").innerHTML = CMDS.map(([k, label]) =>
    `<button class="chip" data-k="${k}">${O.TYPES[k] ? `<i style="background:${O.TYPES[k].color}"></i>` : ""}${label}</button>`).join("");

  const note = (s) =>
    `<div class="note${focus === s.id ? " is-focus" : ""}" data-s="${s.id}">
      <div class="note-top">${O.tag(s.type)}
        <span class="acts"><button class="icon-btn no" data-a="rejected" title="Відхилити">✕</button>${s.type === "visual"
          ? `<button class="btn" data-studio="${s.id}">Відкрити</button>`
          : `<button class="icon-btn yes" data-a="accepted" title="Прийняти">✓</button>`}</span>
      </div>
      <p>${O.esc(s.reason)}</p>
    </div>`;

  const diagHtml = () => `<div class="row"><section class="diag">
    <header><span class="tag">Огляд розділу</span><span>Лише читання: тексту не змінює.</span><button class="icon-btn" data-diag-x title="Сховати">✕</button></header>
    <ul>${O.DIAG.map((d) => `<li><b><i style="background:${O.TYPES[d.type].color}"></i>${d.title}</b><p>${d.text}</p><button class="btn" data-run="${d.type}">${d.run} →</button></li>`).join("")}</ul>
  </section><div></div></div>`;

  function render(scroll) {
    const q = queue();
    if (quiet && !q.find((s) => s.id === focus)) focus = q.length ? q[0].id : null;
    document.body.className = (quiet ? "quiet" : "") + (face === "cmd" ? " face-cmd" : "");
    $("quiet").setAttribute("aria-checked", quiet);
    $("hint").style.display = shown.size ? "none" : "";
    $("chips").style.display = shown.size ? "" : "none";
    O.chips($("chips"), filter, (k) => { filter = k; render(true); }, (s) => shown.has(s.id));

    const text = q.filter((s) => s.type !== "visual");
    bulk.innerHTML = quiet || !shown.size ? "" : q.length
      ? `<button class="btn" data-a="rejected">Відхилити всі</button>${text.length ? `<button class="btn primary" data-a="accepted" title="Візуали вставляються окремо, після генерування">Прийняти всі · ${text.length}</button>` : ""}`
      : `<span class="done">Усе переглянуто</span>`;

    // Quiet mode: only the focused suggestion is expanded, the rest are dotted marks and no margin.
    const opt = quiet
      ? { focus, show: (s) => vis(s) && (s.from ? true : s.id === focus),
          mark: (s, f) => f ? O.mark(s, true) : `<span class="sg dim" data-s="${s.id}">${O.esc(s.from)}</span>` }
      : { focus, show: vis };
    doc.innerHTML = (diag && !quiet ? diagHtml() : "") + O.blocks.map((b) =>
      `<div class="row"><div class="ms">${O.blockHtml(b, opt)}</div>` +
      (quiet ? "" : `<div class="notes">${O.pending((s) => s.block === b.id && vis(s)).map(note).join("")}</div>`) + `</div>`
    ).join("");
    renderDock(q);
    renderStatus();
    if (scroll && quiet) {
      const el = doc.querySelector(".is-focus");
      if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  function renderDock(q) {
    const all = O.S.filter((s) => shown.has(s.id));
    const done = all.filter((s) => s.status !== "pending").length;
    const bar = `<div class="progress"><i style="width:${all.length ? (done / all.length) * 100 : 0}%"></i></div>`;
    const cmdBtn = `<button class="btn ghost" data-k="cmd" title="Нова команда">Команда<kbd>/</kbd></button>`;
    const s = focus && O.get(focus);
    if (!s) {
      dock.innerHTML = bar + `<div class="dock-body end"><b>${!shown.size ? "Правок ще немає" : O.pending((x) => shown.has(x.id)).length ? "У цьому фільтрі все переглянуто" : "Усе переглянуто"}</b>
        <span>${shown.size ? `Прийнято ${all.filter((x) => x.status === "accepted").length} · Відхилено ${all.filter((x) => x.status === "rejected").length}` : "Запустіть команду, щоб отримати пропозиції."}</span>${cmdBtn}</div>`;
      return;
    }
    const yes = s.type === "visual" ? "Відкрити студію" : "Прийняти";
    dock.innerHTML = bar + `<div class="dock-body">
      <div class="dock-top">${O.tag(s.type)}<span class="count">${q.indexOf(s) + 1} з ${q.length}</span></div>
      <p class="reason">${O.what(s) ? `<b>${O.what(s)}.</b> ` : ""}${O.esc(s.reason)}</p>
      <div class="dock-acts">
        <button class="btn ghost" data-k="prev" title="Назад">←<span class="nav-l"> Назад</span></button>
        <button class="btn ghost" data-k="next" title="Пропустити"><span class="nav-l">Пропустити </span>→</button>
        ${cmdBtn}<span class="sp"></span>
        <button class="btn" data-k="rejected">Відхилити<kbd>⌫</kbd></button>
        <button class="btn primary" data-k="accepted">${yes}<kbd>↵</kbd></button>
      </div></div>`;
  }

  function renderStatus() {
    status.className = "";
    if (busy) { status.className = "on"; status.innerHTML = `<span class="spin"></span><span>${busy}…</span>`; }
    else if (msg) { status.className = "on" + (msg.err ? " err" : ""); status.innerHTML = `<span>${msg.text}</span>`; }
  }

  function run(type) {
    if (busy) return;
    busy = CMDS.find((c) => c[0] === type)[1]; msg = null;
    renderStatus();
    if (type === "diag") return setTimeout(() => {
      busy = false; diag = true; quiet = false;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }, 800);
    const pool = O.S.filter((s) => s.type === type && !shown.has(s.id) && (!scope || s.block === scope.block));
    setTimeout(() => {
      if (!pool.length) {
        busy = false;
        msg = { text: scope ? "Для цього фрагмента таких правок немає." : "Нових правок цього типу немає." };
        return renderStatus();
      }
      let i = 0;
      const timer = setInterval(() => {   // suggestions stream in one by one
        shown.add(pool[i++].id);
        if (i >= pool.length) {
          clearInterval(timer); busy = false;
          if (quiet) { face = "dock"; focus = pool[0].id; }
        }
        render(!busy);
      }, 240);
    }, 800);
  }

  function move(d) {
    const q = queue();
    if (!q.length) return;
    focus = q[(q.findIndex((s) => s.id === focus) + d + q.length) % q.length].id;
    render(true);
  }
  function act(st) {
    if (!focus) return;
    if (st === "accepted" && O.get(focus).type === "visual") return O.studio(focus);   // a visual is inserted from the studio, once generated
    const q = queue();
    const id = focus;
    const next = q[q.findIndex((s) => s.id === id) + 1] || q[0];
    focus = next && next.id !== id ? next.id : null;
    O.set(id, st);
  }
  function key(k) {
    if (k === "prev") move(-1);
    else if (k === "next") move(1);
    else if (k === "cmd") { face = "cmd"; render(); input.focus(); }
    else act(k);
  }
  function setQuiet(on) {
    quiet = on; face = "dock";
    if (on && !focus && queue().length) focus = queue()[0].id;
    render(true);
  }

  $("quiet").onclick = () => setQuiet(!quiet);
  $("back").onclick = () => { face = "dock"; render(true); };
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    const cmd = CMDS.find((c) => c[2].test(text));
    if (!cmd) {
      msg = { err: true, text: "Прототип розуміє лише готові команди нижче: довільний запит потребує моделі." };
      return renderStatus();
    }
    input.value = "";
    run(cmd[0]);
  });
  $("quick").addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) run(b.dataset.k); });
  dock.addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) key(b.dataset.k); });
  bulk.addEventListener("click", (e) => {
    const b = e.target.closest("[data-a]");
    if (b) O.set(queue().filter((s) => b.dataset.a === "rejected" || s.type !== "visual").map((s) => s.id), b.dataset.a);
  });
  doc.addEventListener("click", (e) => {
    if (e.target.closest("[data-diag-x]")) { diag = false; return render(); }
    const r = e.target.closest("[data-run]");
    if (r) return run(r.dataset.run);
    if (!window.getSelection().isCollapsed) return;   // keep a fresh text selection intact
    const t = e.target.closest("[data-s]");
    if (!t) return;
    const a = e.target.closest("[data-a]");
    if (a) return O.set(t.dataset.s, a.dataset.a);
    focus = t.dataset.s;
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (O.studioOpen() || !quiet || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape" && face === "cmd") { face = "dock"; input.blur(); return render(true); }
    if (face !== "dock" || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const map = { Enter: "accepted", Backspace: "rejected", Delete: "rejected", ArrowRight: "next", ArrowLeft: "prev", j: "next", k: "prev", "/": "cmd" };
    if (map[e.key]) { e.preventDefault(); key(map[e.key]); }
  });

  function setScope(next) {
    scope = next;
    scopeEl.className = scope ? "on" : "";
    if (scope) scopeEl.querySelector("q").textContent = scope.text;
    input.placeholder = scope ? "Що зробити з цим фрагментом?" : "Що зробити з розділом?";
  }
  scopeEl.querySelector("button").onclick = () => setScope(null);
  doc.addEventListener("mouseup", () => {
    const sel = window.getSelection();
    const text = sel.toString().trim();
    if (sel.isCollapsed || text.length < 4) return;
    const node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
    const block = node.closest("[data-b]");
    if (block) setScope({ block: block.dataset.b, text });
  });

  O.hover(doc);
  O.on(() => render(true));
  $("reset").onclick = () => { shown.clear(); msg = null; diag = false; quiet = false; focus = null; filter = "all"; setScope(null); O.reset(); };
  render();
</script>
</body>
</html>
