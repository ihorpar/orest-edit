<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orest Edit v2 · Студія</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..700&family=Vollkorn:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="ed.css">
<style>
  /* Студія: soft and friendly. The assistant is a floating rounded panel on the left; everything is a pill. */
  :root {
    --f-ui: "Geologica", system-ui, sans-serif;
    --f-text: "Vollkorn", Georgia, serif;
    --f-head: var(--f-ui);
    --bg: #eef1ea; --surface: #fdfefb; --panel: #f6f8f3;
    --line: #dfe5d9; --line-strong: #c3ccba;
    --ink: #17231c; --ink-2: #4b5a50; --ink-3: #7f8c82;
    --accent: #e4572e; --accent-ink: #fffaf6; --accent-soft: #fde6dc;
    --ok: #1f8a5b; --ok-soft: #dcf2e6;
    --del-bg: #fde2da; --del-fg: #a8351a; --ins-bg: #d8f0e2; --ins-fg: #14613f;
    --t-structure: #2b6fd6; --t-clarity: #1f8a5b; --t-interest: #8a4fd0; --t-visual: #d6457f;
    --t-accent: #0e8fa3; --t-spell: #d4442c; --t-fact: #b9770a;
    --r: 18px; --r-sm: 999px; --panel-w: 468px; --top-h: 60px;
    --lift: 0 2px 4px rgba(23, 35, 28, 0.04), 0 18px 44px rgba(23, 35, 28, 0.1);
  }
  body { font-weight: 300; }
  .top { background: var(--bg); border-bottom: 0; padding: 0 20px; }
  .logo i { border-radius: 50%; background: var(--ink); font-family: var(--f-text); }
  .crumb { border-left: 0; padding-left: 4px; }
  .app { grid-template-columns: var(--panel-w) minmax(0, 1fr); }
  #panel {
    order: -1; margin: 4px 0 16px 16px; height: calc(100vh - var(--top-h) - 20px);
    background: var(--surface); border: 0; border-radius: 28px; box-shadow: var(--lift); overflow: hidden;
  }
  #tabs { margin: 12px 12px 0; padding: 4px; gap: 2px; background: var(--bg); border: 0; border-radius: 999px; }
  #tabs button { height: 40px; border-radius: 999px; font-weight: 400; }
  #tabs button.on { background: var(--surface); font-weight: 500; box-shadow: 0 1px 3px rgba(23, 35, 28, 0.14); }
  #tabs button.on::after { display: none; }
  #body { padding: 26px 24px 32px; }
  #body h2 { font-weight: 600; font-size: 24px; letter-spacing: -0.02em; }
  .lead { font-size: 14px; }
  .sec { letter-spacing: 0; text-transform: none; font-size: 15px; font-weight: 500; color: var(--ink); margin-top: 30px; }
  .sec span { color: var(--ink-3); font-weight: 300; }
  .proto { border-top: 0; text-align: center; padding-bottom: 14px; }

  .fmt { margin: 4px auto 0; width: max-content; max-width: calc(100% - 32px); gap: 2px; padding: 0 8px; height: 44px; top: calc(var(--top-h) + 4px); background: var(--surface); border: 0; border-radius: 999px; box-shadow: 0 1px 3px rgba(23, 35, 28, 0.1); }
  .fmt button { border-radius: 999px; }
  .fmt .stats { margin-left: 14px; padding-right: 8px; }
  .sheet { padding-top: 48px; }
  .kicker { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); letter-spacing: 0.06em; margin-bottom: 18px; }
  .ms { font-size: 20px; line-height: 1.7; }
  .ms h1 { font-size: 40px; font-weight: 700; }
  .sg del, .sg ins { border-radius: 6px; padding: 2px 3px; }
  /* the coral accent would read as a deletion here */
  .sg-accent { color: var(--t-accent); border-bottom-color: var(--t-accent); }
  .ms h2.ghost-h { color: var(--t-structure); }
  .callout { border-top: 0; border-radius: 20px; background: var(--surface); box-shadow: 0 1px 3px rgba(23, 35, 28, 0.08); padding: 20px 24px; }
  .ghost-callout, .ghost-fig { border-radius: 20px; }

  .passes { border: 0; padding: 0; background: none; display: grid; gap: 6px; }
  .pass { background: var(--panel); border-radius: 16px; padding: 10px 14px 10px 10px; grid-template-columns: 36px minmax(0, 1fr) auto; }
  .pass.ran:hover { background: var(--bg); }
  .pass.on, .pass.on:hover { background: color-mix(in srgb, var(--t) 13%, var(--surface)); box-shadow: 0 0 0 1.5px var(--t) inset; }
  .pass b { font-weight: 500; }
  .ico { width: 36px; height: 36px; border-radius: 12px; background: color-mix(in srgb, var(--t) 16%, var(--surface)); }
  .pass .n { background: var(--t); color: var(--surface); }
  .card { border: 0; background: var(--panel); border-radius: 20px; padding: 16px 18px 14px; }
  .card.is-focus { background: var(--surface); box-shadow: 0 0 0 2px var(--accent), var(--lift); }
  .ttag { padding: 5px 10px 5px 8px; border-radius: 999px; background: color-mix(in srgb, var(--t) 14%, var(--surface)); font-weight: 500; }
  .card .what { font-size: 17px; }
  .finding, .scope { border: 0; background: var(--panel); border-radius: 20px; }
  .empty { border: 0; background: var(--panel); border-radius: 20px; }
  .starter { border-top: 0; background: var(--panel); border-radius: 20px; padding: 16px 18px; margin-top: 8px; }
  .finds li { border-top: 0; padding: 10px 0; }
  #askq { border-radius: 20px; border-color: var(--line); }
  .btn { font-weight: 400; }
  .btn.solid { font-weight: 500; }
  .bar { height: 8px; }
  .summary b { font-size: 34px; letter-spacing: -0.03em; }
  #selbar { border-radius: 999px; padding: 5px; }
  kbd { border-radius: 8px; }
  @media (max-width: 980px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    #panel { margin: 0 10px 8px; height: auto; border-radius: 22px; }
    .fmt { display: none; }
  }
</style>
</head>
<body>
<script src="shared.js"></script>
<script src="ed.js"></script>
</body>
</html>
